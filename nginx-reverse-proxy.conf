# Nginx Reverse Proxy Configuration
# File ini digunakan untuk menyembunyikan URL asli website

server {
    listen 80;
    listen [::]:80;
    server_name domainanda.com www.domainanda.com;

    # SSL Configuration (uncomment jika menggunakan HTTPS)
    # listen 443 ssl http2;
    # listen [::]:443 ssl http2;
    # ssl_certificate /path/to/ssl/cert.pem;
    # ssl_certificate_key /path/to/ssl/key.pem;

    # Logging
    access_log /var/log/nginx/proxy_access.log;
    error_log /var/log/nginx/proxy_error.log;

    location / {
        # URL website yang ingin disembunyikan
        proxy_pass https://website-asli-yang-ingin-disembunyikan.com;

        # Header penting untuk reverse proxy
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $server_name;

        # Redirect handling
        proxy_redirect off;

        # Timeout settings
        proxy_connect_timeout 90;
        proxy_send_timeout 90;
        proxy_read_timeout 90;

        # Buffer settings
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;

        # WebSocket support (jika diperlukan)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Blokir akses langsung ke file sensitif
    location ~ /\.(?!well-known) {
        deny all;
    }
}

# INSTRUKSI INSTALASI:
# 1. Ganti 'domainanda.com' dengan domain Anda
# 2. Ganti 'https://website-asli-yang-ingin-disembunyikan.com' dengan URL yang ingin di-mask
# 3. Copy file ini ke: /etc/nginx/sites-available/proxy
# 4. Buat symlink: sudo ln -s /etc/nginx/sites-available/proxy /etc/nginx/sites-enabled/
# 5. Test config: sudo nginx -t
# 6. Restart nginx: sudo systemctl restart nginx
