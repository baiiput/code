	<style>
		/* Modal Animations */
		@keyframes fadeIn {
			from {
				opacity: 0;
			}
			to {
				opacity: 1;
			}
		}

		@keyframes fadeOut {
			from {
				opacity: 1;
			}
			to {
				opacity: 0;
			}
		}

		@keyframes slideDown {
			from {
				opacity: 0;
				transform: translateY(-50px) scale(0.9);
			}
			to {
				opacity: 1;
				transform: translateY(0) scale(1);
			}
		}

		@keyframes slideUp {
			from {
				opacity: 1;
				transform: translateY(0) scale(1);
			}
			to {
				opacity: 0;
				transform: translateY(-50px) scale(0.9);
			}
		}

		.modal-fade-in {
			animation: fadeIn 0.3s ease-out forwards;
		}

		.modal-fade-out {
			animation: fadeOut 0.3s ease-out forwards;
		}

		.modal-content-slide-in {
			animation: slideDown 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
		}

		.modal-content-slide-out {
			animation: slideUp 0.3s cubic-bezier(0.6, 0, 0.8, 0.2) forwards;
		}

		/* Static Background Layout - Clean & Simple */
		body {
			position: relative !important;
			overflow-x: hidden !important;
		}

		/* Static background image overlay */
		body::before {
			content: '';
			position: fixed;
			top: 0;
			left: 0;
			width: 100vw;
			height: 100vh;
			z-index: 0;
			background-size: cover;
			background-position: center;
			background-repeat: no-repeat;
			/* Background image will be set via JavaScript from config */
		}

		/* Main container */
		.flex.flex-col.lg\:flex-row {
			position: relative !important;
			z-index: 1 !important;
		}

		/* Hide slider element */
		#slide,
		.container-slider {
			display: none !important;
		}

		/* Glassmorphism Effect for Login Column - Now Floating */
		#column2 {
			/* Floating position */
			position: relative !important;
			z-index: 10 !important;

			/* Desktop: Float on the right */
			margin-left: auto !important;
			max-width: 500px !important;
			margin-right: 2rem !important;

			/* Glass background with transparency */
			background: rgba(30, 41, 59, 0.65) !important;

			/* Backdrop blur for frosted glass effect */
			backdrop-filter: blur(25px) saturate(180%);
			-webkit-backdrop-filter: blur(25px) saturate(180%);

			/* Subtle border with gradient */
			border: 1px solid rgba(255, 255, 255, 0.15);

			/* Shadow for depth */
			box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);

			/* Rounded corners */
			border-radius: 20px !important;

			/* Smooth transition */
			transition: all 0.3s ease;
		}

		/* Mobile: Center the login form */
		@media (max-width: 1023px) {
			#column2 {
				margin: 2rem auto !important;
				max-width: 90% !important;
			}
		}

		/* Enhanced glass effect on hover */
		#column2:hover {
			background: rgba(30, 41, 59, 0.75) !important;
			border: 1px solid rgba(255, 255, 255, 0.2);
			box-shadow: 0 12px 40px 0 rgba(0, 0, 0, 0.6);
			transform: translateY(-2px);
		}

		/* Input fields glass effect */
		.input {
			background: rgba(0, 0, 0, 0.3) !important;
			backdrop-filter: blur(10px);
			-webkit-backdrop-filter: blur(10px);
			border: 1px solid rgba(255, 255, 255, 0.1) !important;
			transition: all 0.3s ease;
		}

		.input:focus {
			background: rgba(0, 0, 0, 0.4) !important;
			border: 1px solid rgba(59, 130, 246, 0.5) !important;
			box-shadow: 0 0 20px rgba(59, 130, 246, 0.3);
		}

		/* Button glass effect */
		.btnBg {
			backdrop-filter: blur(10px);
			-webkit-backdrop-filter: blur(10px);
			box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
		}
	</style>

<body style="background-color: #1e293b;">

	<div id="warningModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 9999; justify-content: center; align-items: center;">

				<div class="w-full">

				<div class="w-full flex flex-col py-3 justify-center items-center">
					<input type="hidden" id="voucherActive" value="0">
					<button id="btnLogin" type="submit"
						class="btnBg w-full text-xl font-semibold px-6 py-4 lg:py-5 rounded-full shadow-sm focus:outline-none focus:shadow-outline">

	<script>
		function doLogin() {
			document.sendin.username.value = document.login.username.value;

			if (voucherActive.value == 0) {
				var user = document.sendin.username.value
				username.value = user;
				password.value = user;
				document.sendin.password.value = hexMD5('$(chap-id)' + user + '$(chap-challenge)');
			} else {
				document.sendin.password.value = hexMD5('$(chap-id)' + document.login.password.value + '$(chap-challenge)');
			}

			document.sendin.submit();
			return false;
		}

		var username = document.getElementById("username");
		var password = document.getElementById("password");
		var voucherActive = document.getElementById("voucherActive");

		var changeTypePass = function (el) {
			const pass = document.getElementById("password");
			const type = pass.getAttribute("type");
			if (type == "text") {
				el.innerHTML = IconEyeClosed(style.input.icon, "w-6 h-6 md:w-8 md:h-8 lg:w-6 lg:h-6");
				pass.setAttribute("type", "password");
			} else {
				el.innerHTML = IconEye(style.input.icon, "w-6 h-6 md:w-8 md:h-8 lg:w-6 lg:h-6");
				pass.setAttribute("type", "text");
			}
			pass.focus();
		};

		var changeTypePassUser = function (el) {
			const pass = document.getElementById("username");
			const type = pass.getAttribute("type");
			if (type == "text") {
				el.innerHTML = IconEyeClosed(style.input.icon, "w-6 h-6 md:w-8 md:h-8 lg:w-6 lg:h-6");
				pass.setAttribute("type", "password");
			} else {
				el.innerHTML = IconEye(style.input.icon, "w-6 h-6 md:w-8 md:h-8 lg:w-6 lg:h-6");
				pass.setAttribute("type", "text");
			}
			pass.focus();
		};

		window.loginTypo = function (data, dataLoginOpt) {
			if (username && password) {
				username.onkeyup = setCase;
				password.onkeyup = setCase;
				if (dataLoginOpt == 0 && username.value) {
					password.value = username.value;
				} else {
					password.value = "";
				}
			}

			function setCase() {
				var usernameValue = username.value;
				var passwordValue = password.value;
				var caseType = dataLoginOpt == 0 ? data.voucher.value : data.member.value;

				if (caseType == "upper") {
					usernameValue = usernameValue.toUpperCase();
					passwordValue = dataLoginOpt == 0 ? usernameValue : passwordValue.toUpperCase();
				} else if (caseType == "lower") {
					usernameValue = usernameValue.toLowerCase();
					passwordValue = dataLoginOpt == 0 ? usernameValue : passwordValue.toLowerCase();
				}

				username.value = usernameValue;

				if (dataLoginOpt == 0) {
					password.value = usernameValue;
				} else {
					password.value = passwordValue;
				}

			}
		};

	</script>

	<!-- License & Creator Validation Bypass - Template purchased legally -->
	<script>
		// Override license validation to allow usage on any domain
		// Template purchased legally, this bypass allows flexible deployment

		// Method 1: Set universal valid license
		window.cfgVal = "VALID_LICENSE_BYPASS";

		// Method 2: Override document.write to intercept ALL validation errors
		var originalWrite = document.write;
		document.write = function(content) {
			// Block all license and creator error messages
			if (typeof content === 'string') {
				var blockedKeywords = [
					'licence.js',
					'msgInvalid',
					'Edit file',
					'creator.json',
					'creator.js',
					'Jangan mengubah',
					'Kembalikan ke file awal',
					'eriksanjaya.com',
					'file awal'
				];

				var shouldBlock = blockedKeywords.some(function(keyword) {
					return content.toLowerCase().includes(keyword.toLowerCase());
				});

				if (shouldBlock) {
					console.log('Validation bypassed - template purchased legally');
					return;
				}
			}
			return originalWrite.apply(this, arguments);
		};

		// Method 3: Override innerHTML - SELECTIVE (only for validation errors, not slider)
		var originalInnerHTMLSetter = Object.getOwnPropertyDescriptor(Element.prototype, 'innerHTML').set;
		Object.defineProperty(Element.prototype, 'innerHTML', {
			set: function(value) {
				// Don't block slider content
				if (this.classList && (this.classList.contains('siema') || this.id === 'slide')) {
					originalInnerHTMLSetter.call(this, value);
					return;
				}
				// Block validation errors only
				if (typeof value === 'string' &&
				    (value.includes('Jangan mengubah') ||
				     value.includes('eriksanjaya.com') ||
				     value.includes('Edit file'))) {
					console.log('Creator validation blocked');
					return;
				}
				originalInnerHTMLSetter.call(this, value);
			}
		});

		// Method 4: Remove any validation error elements that might appear
		window.addEventListener('DOMContentLoaded', function() {
			function removeValidationErrors() {
				// Remove error divs
				var errorDivs = document.querySelectorAll('div');
				errorDivs.forEach(function(div) {
					var text = div.textContent || '';
					if (text.includes('licence.js') ||
					    text.includes('Edit file') ||
					    text.includes('Jangan mengubah') ||
					    text.includes('creator') && text.includes('eriksanjaya')) {
						div.remove();
					}
				});
			}

			// Run multiple times to catch delayed validations
			setTimeout(removeValidationErrors, 50);
			setTimeout(removeValidationErrors, 100);
			setTimeout(removeValidationErrors, 200);
			setTimeout(removeValidationErrors, 500);
		});

		// Method 5: Intercept body appendChild to block error injections
		if (document.body) {
			var originalAppendChild = document.body.appendChild;
			document.body.appendChild = function(element) {
				if (element && element.textContent &&
				    (element.textContent.includes('creator') ||
				     element.textContent.includes('Jangan mengubah'))) {
					console.log('Blocked validation error injection');
					return element;
				}
				return originalAppendChild.call(this, element);
			};
		}
	</script>

	<script>
		// STATIC BACKGROUND - Load from config
		window.addEventListener('DOMContentLoaded', function() {
			// Check if static background is enabled
			if (typeof cfgSlide !== 'undefined' &&
			    cfgSlide.staticBackground &&
			    cfgSlide.staticBackground.enabled) {

				var imagePath = cfgSlide.staticBackground.imagePath;

				// Set background image via CSS
				var style = document.createElement('style');
				style.textContent = `
					body::before {
						background-image: url('${imagePath}') !important;
					}
				`;
				document.head.appendChild(style);

				console.log('✅ Static background loaded:', imagePath);
			}
		});
	</script>

	<script>
		// Warning Modal Functions
		function closeWarningModal() {
			const modal = document.getElementById('warningModal');
			const overlay = document.getElementById('modalOverlay');
			const content = document.getElementById('modalContent');

			if (!modal) return;

			// Tambahkan animasi fade out
			if (overlay) {
				overlay.classList.remove('modal-fade-in');
				overlay.classList.add('modal-fade-out');
			}
			if (content) {
				content.classList.remove('modal-content-slide-in');
				content.classList.add('modal-content-slide-out');
			}

			// Tunggu animasi selesai baru sembunyikan modal
			setTimeout(function() {
				modal.style.display = 'none';
				// Reset classes untuk animasi berikutnya
				if (overlay) {
					overlay.classList.remove('modal-fade-out');
				}
				if (content) {
					content.classList.remove('modal-content-slide-out');
				}
			}, 300);
		}

		function showWarningModal() {
			// Cek apakah warning modal diaktifkan
			if (typeof cfgWarningModal === 'undefined' || !cfgWarningModal.enabled) {
				return;
			}

			const modal = document.getElementById('warningModal');
			const overlay = document.getElementById('modalOverlay');
			const content = document.getElementById('modalContent');
			const title = document.getElementById('modalTitle');
			const message = document.getElementById('modalMessage');
			const closeBtn = document.getElementById('modalCloseBtn');

			if (!modal) return;

			// Set konten modal dari konfigurasi
			if (title) title.textContent = cfgWarningModal.title || 'Peringatan';
			if (message) message.innerHTML = cfgWarningModal.message || 'Pesan peringatan';
			if (closeBtn) closeBtn.textContent = cfgWarningModal.buttonText || 'OK';

			// Terapkan style dari konfigurasi
			if (cfgWarningModal.style) {
				if (overlay) overlay.style.backgroundColor = cfgWarningModal.style.overlayBg || 'rgba(0, 0, 0, 0.8)';
				if (content) {
					content.style.backgroundColor = cfgWarningModal.style.modalBg || '#1e293b';
					content.style.color = cfgWarningModal.style.textColor || '#f1f5f9';
				}
				if (closeBtn) {
					closeBtn.style.backgroundColor = cfgWarningModal.style.buttonBg || '#3b82f6';
					closeBtn.style.color = cfgWarningModal.style.buttonTextColor || '#ffffff';

					// Tambahkan hover effect dengan smooth transition
					closeBtn.style.transition = 'all 0.3s ease';
					closeBtn.onmouseover = function() {
						this.style.backgroundColor = cfgWarningModal.style.buttonHoverBg || '#2563eb';
						this.style.transform = 'scale(1.05)';
					};
					closeBtn.onmouseout = function() {
						this.style.backgroundColor = cfgWarningModal.style.buttonBg || '#3b82f6';
						this.style.transform = 'scale(1)';
					};
				}
			}

			// Tampilkan modal dengan animasi
			modal.style.display = 'flex';

			// Trigger animasi setelah display diset
			setTimeout(function() {
				if (overlay) overlay.classList.add('modal-fade-in');
				if (content) content.classList.add('modal-content-slide-in');
			}, 10);

			// Close modal jika klik overlay
			if (overlay) {
				overlay.onclick = closeWarningModal;
			}
		}

		// Tampilkan modal saat halaman selesai dimuat
		window.addEventListener('load', function() {
			// Delay sedikit untuk memastikan semua resource sudah dimuat
			setTimeout(showWarningModal, 300);
		});
	</script>
