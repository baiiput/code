<head>

	<title>Home</title>

	<style>
		/* Modal Animations */
		@keyframes fadeIn {
			from {
				opacity: 0;
			}
			to {
				opacity: 1;
			}
		}

		@keyframes fadeOut {
			from {
				opacity: 1;
			}
			to {
				opacity: 0;
			}
		}

		@keyframes slideDown {
			from {
				opacity: 0;
				transform: translateY(-50px) scale(0.9);
			}
			to {
				opacity: 1;
				transform: translateY(0) scale(1);
			}
		}

		@keyframes slideUp {
			from {
				opacity: 1;
				transform: translateY(0) scale(1);
			}
			to {
				opacity: 0;
				transform: translateY(-50px) scale(0.9);
			}
		}

		.modal-fade-in {
			animation: fadeIn 0.3s ease-out forwards;
		}

		.modal-fade-out {
			animation: fadeOut 0.3s ease-out forwards;
		}

		.modal-content-slide-in {
			animation: slideDown 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
		}

		.modal-content-slide-out {
			animation: slideUp 0.3s cubic-bezier(0.6, 0, 0.8, 0.2) forwards;
		}
	</style>
</head>

<body style="background-color: #1e293b;">

	<!-- Warning Modal -->
	<div id="warningModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 9999; justify-content: center; align-items: center;">
		<div id="modalOverlay" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%;"></div>
		<div id="modalContent" style="position: relative; max-width: 90%; width: 500px; max-height: 90vh; overflow-y: auto; padding: 30px; border-radius: 15px; box-shadow: 0 10px 40px rgba(0,0,0,0.5);">
			<h2 id="modalTitle" style="font-size: 24px; font-weight: bold; margin-bottom: 20px; text-align: center;"></h2>
			<div id="modalMessage" style="font-size: 16px; line-height: 1.6; margin-bottom: 25px;"></div>
			<div style="text-align: center;">
				<button id="modalCloseBtn" onclick="closeWarningModal()" style="padding: 12px 30px; border: none; border-radius: 25px; font-size: 16px; font-weight: 600; cursor: pointer; transition: all 0.3s ease;">
				</button>
			</div>
		</div>
	</div>

	<div class="flex flex-col lg:flex-row min-h-screen text-base justify-center items-center">

		<div id="slide" class="container-slider w-full lg:w-2/3 h-auto"></div>

		<div id="column2"
			class="bg w-full lg:w-1/3 flex flex-col justify-center items-center h-full lg:h-screen overflow-y-auto px-6 lg:px-12 py-6 space-y-6">

			<form id="formLogin" action="#" method="POST"
				class="w-full h-full flex flex-col space-y-3 justify-center items-center">

				<div id="logo" class="w-full flex justify-center items-center"></div>

				<div class="space-y-1">
					<h1 id="title" class="titleLogin w-full text-center text-3xl leading-relaxed text-slate-50"></h1>
					<p id="sub_title" class="subTitleLogin text-slate-50 text-xl"></p>
				</div>

				<div id="inputField" class="w-full space-y-3">
					<div id="domUsername" class="w-full space-y-3">
						<label id="labelUsername" for="username" class="block text-xl font-medium text-slate-50">Room
							Number</label>
						<input type="text" id="username" name="username" value="$(username)"
							placeholder="input room number"
							class="input mt-1 block w-full px-6 py-4 lg:py-5 rounded-full placeholder:text-slate-500 text-xl text-slate-50 shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500">
					</div>

					<div id="domPassword" class="w-full space-y-3">
						<label id="labelPassword" for="password"
							class="block text-xl font-medium text-slate-50">Password</label>
						<input type="password" id="password" name="password" placeholder="input password"
							class="input mt-1 block w-full px-6 py-4 lg:py-5 rounded-full bg-black bg-opacity-30 text-xl text-slate-50 shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500">
					</div>
				</div>

				<div class="w-full">
					$(if error)
					<p id="notif" class="w-full text-lg">$(error)</p>
					$(endif)
				</div>

				<div class="w-full flex flex-col py-3 justify-center items-center">
					<input type="hidden" id="voucherActive" value="0">
					<button id="btnLogin" type="submit"
						class="btnBg w-full text-xl font-semibold px-6 py-4 lg:py-5 rounded-full shadow-sm focus:outline-none focus:shadow-outline">
					</button>
				</div>

			</form>

			<div id="secLink" class="linkColor w-full flex space-x-6 justify-center items-center">
				<div id="loginOpt" onclick="loginOpt()"
					class="w-max cursor-pointer space-x-1 justify-center items-center hidden"></div>
				<div id="btnTrial" class="w-max cursor-pointer space-x-1 justify-center items-center hidden"></div>
				<div id="btnLogInQrCode" class="w-max cursor-pointer space-x-1 justify-center items-center hidden">
				</div>
			</div>

			<div class="w-full flex justify-end items-center">
				<div id="chat" class="fixed bottom-3"></div>
			</div>

			<div id="paketInternet" class="w-full hidden pb-12"></div>

			<div id="copyright"></div>

		</div>
	</div>

	<a id="linkTrial" href="$(link-login-only)?dst=$(link-orig-esc)&amp;username=T-$(mac-esc)"></a>
	<p id="isTrial" class="hidden">$(trial)</p>
	<!-- <p id="isTrial" class="hidden">yes</p> -->

	<script>
		function doLogin() {
			document.sendin.username.value = document.login.username.value;

			if (voucherActive.value == 0) {
				var user = document.sendin.username.value
				username.value = user;
				password.value = user;
				document.sendin.password.value = hexMD5('$(chap-id)' + user + '$(chap-challenge)');
			} else {
				document.sendin.password.value = hexMD5('$(chap-id)' + document.login.password.value + '$(chap-challenge)');
			}

			document.sendin.submit();
			return false;
		}

		var username = document.getElementById("username");
		var password = document.getElementById("password");
		var voucherActive = document.getElementById("voucherActive");

		var changeTypePass = function (el) {
			const pass = document.getElementById("password");
			const type = pass.getAttribute("type");
			if (type == "text") {
				el.innerHTML = IconEyeClosed(style.input.icon, "w-6 h-6 md:w-8 md:h-8 lg:w-6 lg:h-6");
				pass.setAttribute("type", "password");
			} else {
				el.innerHTML = IconEye(style.input.icon, "w-6 h-6 md:w-8 md:h-8 lg:w-6 lg:h-6");
				pass.setAttribute("type", "text");
			}
			pass.focus();
		};

		var changeTypePassUser = function (el) {
			const pass = document.getElementById("username");
			const type = pass.getAttribute("type");
			if (type == "text") {
				el.innerHTML = IconEyeClosed(style.input.icon, "w-6 h-6 md:w-8 md:h-8 lg:w-6 lg:h-6");
				pass.setAttribute("type", "password");
			} else {
				el.innerHTML = IconEye(style.input.icon, "w-6 h-6 md:w-8 md:h-8 lg:w-6 lg:h-6");
				pass.setAttribute("type", "text");
			}
			pass.focus();
		};

		window.loginTypo = function (data, dataLoginOpt) {
			if (username && password) {
				username.onkeyup = setCase;
				password.onkeyup = setCase;
				if (dataLoginOpt == 0 && username.value) {
					password.value = username.value;
				} else {
					password.value = "";
				}
			}

			function setCase() {
				var usernameValue = username.value;
				var passwordValue = password.value;
				var caseType = dataLoginOpt == 0 ? data.voucher.value : data.member.value;

				if (caseType == "upper") {
					usernameValue = usernameValue.toUpperCase();
					passwordValue = dataLoginOpt == 0 ? usernameValue : passwordValue.toUpperCase();
				} else if (caseType == "lower") {
					usernameValue = usernameValue.toLowerCase();
					passwordValue = dataLoginOpt == 0 ? usernameValue : passwordValue.toLowerCase();
				}

				username.value = usernameValue;

				if (dataLoginOpt == 0) {
					password.value = usernameValue;
				} else {
					password.value = passwordValue;
				}

			}
		};

	</script>

	<script src="./config/data/chat.js?v=20.3"></script>
	<script src="./config/data/copyright.js?v=20.3"></script>

	<script src="./assets/md5.js"></script>

	<script>
		// Warning Modal Functions
		function closeWarningModal() {
			const modal = document.getElementById('warningModal');
			const overlay = document.getElementById('modalOverlay');
			const content = document.getElementById('modalContent');

			if (!modal) return;

			// Tambahkan animasi fade out
			if (overlay) {
				overlay.classList.remove('modal-fade-in');
				overlay.classList.add('modal-fade-out');
			}
			if (content) {
				content.classList.remove('modal-content-slide-in');
				content.classList.add('modal-content-slide-out');
			}

			// Tunggu animasi selesai baru sembunyikan modal
			setTimeout(function() {
				modal.style.display = 'none';
				// Reset classes untuk animasi berikutnya
				if (overlay) {
					overlay.classList.remove('modal-fade-out');
				}
				if (content) {
					content.classList.remove('modal-content-slide-out');
				}
			}, 300);
		}

		function showWarningModal() {
			// Cek apakah warning modal diaktifkan
			if (typeof cfgWarningModal === 'undefined' || !cfgWarningModal.enabled) {
				return;
			}

			const modal = document.getElementById('warningModal');
			const overlay = document.getElementById('modalOverlay');
			const content = document.getElementById('modalContent');
			const title = document.getElementById('modalTitle');
			const message = document.getElementById('modalMessage');
			const closeBtn = document.getElementById('modalCloseBtn');

			if (!modal) return;

			// Set konten modal dari konfigurasi
			if (title) title.textContent = cfgWarningModal.title || 'Peringatan';
			if (message) message.innerHTML = cfgWarningModal.message || 'Pesan peringatan';
			if (closeBtn) closeBtn.textContent = cfgWarningModal.buttonText || 'OK';

			// Terapkan style dari konfigurasi
			if (cfgWarningModal.style) {
				if (overlay) overlay.style.backgroundColor = cfgWarningModal.style.overlayBg || 'rgba(0, 0, 0, 0.8)';
				if (content) {
					content.style.backgroundColor = cfgWarningModal.style.modalBg || '#1e293b';
					content.style.color = cfgWarningModal.style.textColor || '#f1f5f9';
				}
				if (closeBtn) {
					closeBtn.style.backgroundColor = cfgWarningModal.style.buttonBg || '#3b82f6';
					closeBtn.style.color = cfgWarningModal.style.buttonTextColor || '#ffffff';

					// Tambahkan hover effect dengan smooth transition
					closeBtn.style.transition = 'all 0.3s ease';
					closeBtn.onmouseover = function() {
						this.style.backgroundColor = cfgWarningModal.style.buttonHoverBg || '#2563eb';
						this.style.transform = 'scale(1.05)';
					};
					closeBtn.onmouseout = function() {
						this.style.backgroundColor = cfgWarningModal.style.buttonBg || '#3b82f6';
						this.style.transform = 'scale(1)';
					};
				}
			}

			// Tampilkan modal dengan animasi
			modal.style.display = 'flex';

			// Trigger animasi setelah display diset
			setTimeout(function() {
				if (overlay) overlay.classList.add('modal-fade-in');
				if (content) content.classList.add('modal-content-slide-in');
			}, 10);

			// Close modal jika klik overlay
			if (overlay) {
				overlay.onclick = closeWarningModal;
			}
		}

		// Tampilkan modal saat halaman selesai dimuat
		window.addEventListener('load', function() {
			// Delay sedikit untuk memastikan semua resource sudah dimuat
			setTimeout(showWarningModal, 300);
		});
	</script>

</body>
