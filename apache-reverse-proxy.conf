# Apache Reverse Proxy Configuration
# File .htaccess atau VirtualHost config untuk menyembunyikan URL asli

<VirtualHost *:80>
    ServerName domainanda.com
    ServerAlias www.domainanda.com

    # SSL Configuration (uncomment jika menggunakan HTTPS)
    # <VirtualHost *:443>
    # SSLEngine on
    # SSLCertificateFile /path/to/ssl/cert.pem
    # SSLCertificateKeyFile /path/to/ssl/key.pem
    # </VirtualHost>

    # Enable Proxy
    ProxyPreserveHost On
    ProxyRequests Off

    # URL website yang ingin disembunyikan
    ProxyPass / https://website-asli-yang-ingin-disembunyikan.com/
    ProxyPassReverse / https://website-asli-yang-ingin-disembunyikan.com/

    # Header settings
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"

    # Logging
    ErrorLog ${APACHE_LOG_DIR}/proxy_error.log
    CustomLog ${APACHE_LOG_DIR}/proxy_access.log combined
</VirtualHost>

# ============================================
# ALTERNATIF: File .htaccess (untuk shared hosting)
# ============================================
# Simpan kode di bawah ini di file .htaccess jika tidak punya akses VirtualHost

# <IfModule mod_rewrite.c>
#     RewriteEngine On
#
#     # Aktifkan proxy
#     SSLProxyEngine On
#
#     # Redirect semua request ke website asli
#     RewriteRule ^(.*)$ https://website-asli-yang-ingin-disembunyikan.com/$1 [P,L]
# </IfModule>

# INSTRUKSI INSTALASI:
#
# Metode 1: VirtualHost (VPS/Dedicated Server)
# 1. Enable module proxy: sudo a2enmod proxy proxy_http ssl headers
# 2. Copy config ke: /etc/apache2/sites-available/proxy.conf
# 3. Enable site: sudo a2ensite proxy.conf
# 4. Test config: sudo apache2ctl configtest
# 5. Restart Apache: sudo systemctl restart apache2
#
# Metode 2: .htaccess (Shared Hosting)
# 1. Uncomment bagian .htaccess di atas
# 2. Ganti URL target
# 3. Upload file .htaccess ke root directory domain Anda
# 4. Pastikan mod_rewrite dan mod_proxy enabled di hosting
